# Template di configurazione per la fase di discovery.
# Per usarlo: copia questo file in `config.yaml` e adatta i valori.
#
#   cp config.example.yaml config.yaml
#
# Lo script src/discover.py legge SOLO config.yaml. Le modifiche locali
# non devono finire in git.

crawler:
  # User-Agent identificativo. Aggiornare l'email di contatto.
  user_agent: "DIEM-Chatbot-Project/1.0 (+contact: studente@studenti.unisa.it)"

  # Domini da cui è permesso attraversare/indicizzare HTML.
  # Lo scope DIEM (sezione 'scope') filtra ulteriormente docenti.unisa.it
  # e corsi.unisa.it.
  allowed_domains:
    - www.diem.unisa.it
    - docenti.unisa.it
    - corsi.unisa.it
    - rubrica.unisa.it

  # Domini in cui è permesso scoprire (e in seguito scaricare) PDF.
  pdf_allowed_domains:
    - www.diem.unisa.it
    - docenti.unisa.it
    - corsi.unisa.it
    - www.unisa.it
    - web.unisa.it

  # Limiti totali del crawl. Per un crawl completo aumentare, ad esempio
  # max_total_urls: 6000 e max_depth: 4.
  max_total_urls: 500
  max_depth: 3

  # Limiti per dominio. Un dominio non elencato qui ha limite implicito 0
  # e viene quindi escluso dal crawl, anche se è in allowed_domains.
  per_domain_limits:
    www.diem.unisa.it: 200
    docenti.unisa.it: 200
    corsi.unisa.it: 150
    rubrica.unisa.it: 200
    www.unisa.it: 50
    web.unisa.it: 50

  # Parametri di rete e cortesia.
  timeout: 20
  max_concurrent_requests: 5
  rate_limit_per_domain_rps: 2
  respect_robots_txt: true
  use_sitemap: true
  # URL già visitati vengono ricontrollati dopo questa età minima.
  refresh_after_days: 7

  # Limite massimo (in byte) per il salvataggio dell'HTML.
  # Le pagine più grandi vengono ignorate con status="too_large".
  max_html_bytes: 5000000

  # Estrazione PDF (src/extract_pdf.py).
  pdf_max_bytes: 104857600
  pdf_extraction_workers: 4
  pdf_max_concurrent_downloads: 3
  pdf_download_delay_seconds: 0
  pdf_skip_recent_days: 7
  pdf_force_reextract: false
  pdf_extraction:
    use_ocr: false
    use_layout: true
    ignore_images: false
    header: false
    footer: false

course_catalogue:
  # Il catalogo Cineca e' una SPA Angular: questi contenuti vengono ingeriti
  # dagli endpoint JSON invece che dal crawler HTML.
  enabled: true
  domain: unisa.coursecatalogue.cineca.it
  course_entries:
    - year: "2023"
      course_id: "500189"  # Ingegneria Informatica
    - year: "2023"
      course_id: "500639"  # Ingegneria dell'Informazione per la Medicina Digitale
    - year: "2023"
      course_id: "500191"  # Ingegneria Informatica magistrale
    - year: "2023"
      course_id: "500648"  # Information Engineering for Digital Medicine
    - year: "2023"
      course_id: "500679"  # Electrical Engineering for Digital Energy
    - year: "2024"
      course_id: "500189"  # Ingegneria Informatica
    - year: "2024"
      course_id: "500639"  # Ingegneria dell'Informazione per la Medicina Digitale
    - year: "2024"
      course_id: "500191"  # Ingegneria Informatica magistrale
    - year: "2024"
      course_id: "500648"  # Information Engineering for Digital Medicine
    - year: "2024"
      course_id: "500679"  # Electrical Engineering for Digital Energy
    - year: "2025"
      course_id: "500853"  # Ingegneria Informatica
    - year: "2025"
      course_id: "500838"  # Ingegneria dell'Informazione per la Medicina Digitale
    - year: "2025"
      course_id: "500854"  # Ingegneria Informatica magistrale
    - year: "2025"
      course_id: "500878"  # Information Engineering for Digital Medicine
    - year: "2025"
      course_id: "500879"  # Electrical Engineering for Digital Energy
  fetch_teaching_details: true
  skip_recent_days: 7
  timeout: 20

scope:
  # Domini gestiti come "DIEM-aware".
  diem_domain: www.diem.unisa.it
  teacher_domain: docenti.unisa.it
  course_domain: corsi.unisa.it
  directory_domain: rubrica.unisa.it
  teaching_council_domain: cd.unisa.it
  course_catalogue_domain: unisa.coursecatalogue.cineca.it

  # Percorsi corso ammessi per corsi.unisa.it/<percorso-corso>/...
  # Solo i corsi DIEM elencati qui vengono attraversati: niente match
  # generici sul primo segmento numerico (regola stretta).
  allowed_course_paths:
    - ingegneria-dell-informazione-per-la-medicina-digitale
    - ingegneria-informatica
    - electrical-engineering-for-digital-energy
    - information-engineering-for-digital-medicine
    - ingegneria-informatica-magistrale
    - ingegneria-dell-informazione
    - photovoltaics
    - DOT18CK8F9
    - DOT229NLP9

  # Codici corso DIEM riconosciuti nel path (oltre ai percorsi corso).
  # Quotare i codici puramente numerici per evitare che YAML li
  # interpreti come integer.
  allowed_course_codes:
    - IE128L-8
    - IE127L-8
    - IE233LM-28
    - IE232LM-32
    - IE227LM-32
    - "88605"
    - "88608"
    - 06128L-8
    - 06127L-8
    - 06233LM-28
    - 06232LM-32
    - 06227LM-32

  # Alias numerici usati da corsi.unisa.it per pagine operative come orari,
  # calendario, piani di studio e versioni inglesi dei corsi DIEM.
  allowed_course_numeric_ids:
    - "0650106200800001"
    - "0650106200800003"
    - "0650107302900001"
    - "0650107303300001"
    - "0650107303300003"

paths:
  # Path relativi alla root del progetto.
  urls_seed: "data/urls.txt"
  raw_html_dir: "data/raw_html"
  raw_pdf_dir: "data/raw_pdf"
  discovered_urls_file: "data/discovered_urls.jsonl"
  checkpoint_file: "data/checkpoint.json"
  discovery_state_file: "data/discovery_state.json"
  processed_raw_markdown_dir: "data/processed/markdown_raw"
  processed_markdown_dir: "data/processed/markdown"
  processed_manifest_file: "data/processed/manifest.jsonl"
  processed_stats_file: "data/processed/stats.json"
